<rect x="250" y="62" width="270" height="52" rx="7" fill="#FBEFE1" stroke="#C26A1E" stroke-width="1.3"/>
<text x="385.0" y="83.255" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="middle">Quantize</text>
<text x="385.0" y="99.505" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="middle">W_q = round(W / s + z),  b ∈ {1, 2, 4, 8} bits</text>
<rect x="250" y="136" width="270" height="112" rx="7" fill="#FBEFE1" stroke="#C26A1E" stroke-width="1.3"/>
<text x="260" y="165.52" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start">Proximal solver (alternate)</text>
<text x="260" y="181.77" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start">W_e ← shrink_lp( W − Q⁻¹(W_q) )</text>
<text x="260" y="196.26000000000002" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start">   sparse outlier-aware error, p &lt; 1</text>
<text x="260" y="210.75000000000003" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start">z ← mean( W_q − (W − W_e) / s )</text>
<text x="260" y="225.24000000000004" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="start">   closed-form zero-point update</text>
