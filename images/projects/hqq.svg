<text x="115" y="225.0" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="middle">W (fp16) split into groups</text>
<text x="115" y="239.175" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="middle">of g = 64 weights</text>
<text x="115" y="253.35" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="middle"></text>
<text x="115" y="267.525" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="middle">one scale s and zero z</text>
<text x="115" y="281.7" font-size="10.5" fill="#374151" font-weight="normal" text-anchor="middle">per group</text>
